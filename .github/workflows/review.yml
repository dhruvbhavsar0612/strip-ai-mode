name: Code review

on: [pull_request]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  eslint-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm install

      - name: ESLint check
        run: npm run lint
